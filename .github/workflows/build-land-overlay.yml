# Build the bundled public-land overview, and optionally seed `public_lands`.
#
# WHY THIS RUNS IN CI RATHER THAN ANYWHERE ELSE
#
# The overlay is built from eight government ArcGIS services. A developer's
# laptop can reach them; the agent sandbox cannot (outbound CONNECT to
# gis.blm.gov and friends is refused at the proxy); and Vercel cannot hold a
# job open long enough — the API is one serverless function with a 30-second
# ceiling and a read-only filesystem.
#
# A CI runner has an open network, an hour of wall clock, and a checkout it can
# commit back to. That makes it the only place this job has ever actually fit.
#
# Run it from the Actions tab. It is deliberately not on a schedule: these
# boundaries move on a timescale of years, and a nightly job against public
# infrastructure to rediscover that would be rude.

name: Build land overlay

on:
  workflow_dispatch:
    inputs:
      # 5 km² was the first default and it is a fine number for FIDELITY — a
      # 5 km² parcel is about two pixels at zoom 6, so it is genuinely visible.
      # It is the wrong number for a file every camper downloads: it produced
      # 10,587 parcels and 7.8 MB, which is a real download on a phone before
      # the map has drawn anything. 25 keeps everything about 5 km across and
      # up, which is what a zoomed-out map can show anyway.
      min_area:
        description: 'Drop parcels smaller than this many km² (bigger = smaller file)'
        required: false
        default: '25'
      offset:
        description: 'Simplification in degrees (0.01 ≈ 1.1 km)'
        required: false
        default: '0.01'
      seed_database:
        description: 'Also seed public_lands for the full-detail pack (slow)'
        type: boolean
        required: false
        default: false

# The job commits the rebuilt overlay back to the branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Eight government services, tiled and rate-limited. This is not quick.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build the overview
        run: |
          npm run map:land -- \
            --min-area=${{ inputs.min_area }} \
            --offset=${{ inputs.offset }}

      - name: Report the result
        run: |
          ls -lh public/map/public-land-overview.json
          echo "### Land overlay rebuilt" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "
            const o = require('./public/map/public-land-overview.json');
            console.log('parcels     ', o.features.length);
            console.log('built at    ', o.builtAt);
            console.log('simplify    ', o.simplifyDegrees + ' deg');
            console.log('min area    ', o.minAreaSqKm + ' km2');
            for (const s of o.sources) {
              console.log(
                (s.ok ? '  ok   ' : '  FAIL ') + s.id.padEnd(32),
                String(s.featuresKept).padStart(7),
                s.truncated ? 'TRUNCATED' : ''
              );
            }
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------------------
      # COMMIT BEFORE ANYTHING OPTIONAL RUNS.
      #
      # This used to come last, after the optional seed. The first real run
      # spent six and a half minutes building a perfectly good 10,587-parcel
      # overlay, the seed step then exited 1 because the Supabase secrets are
      # not set on this repo, and GitHub skipped every remaining step —
      # including this one. The overlay was thrown away at the last hurdle and
      # the run went red having actually succeeded at its job.
      #
      # The thing this workflow exists to produce is now safe on the branch
      # before any of the optional extras get a chance to fail.
      # ---------------------------------------------------------------------
      - name: Commit the overlay
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- public/map/public-land-overview.json; then
            echo 'Overlay unchanged — nothing to commit.'
            exit 0
          fi

          git add public/map/public-land-overview.json
          git commit -m 'Rebuild bundled public-land overview'

          # The build takes several minutes and the branch can move under it,
          # which would bounce this push as out of date after all that work.
          # The overlay is a single generated file that nothing else writes, so
          # replaying it on top of whatever landed meanwhile is always right.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected — rebasing onto the current branch (try $attempt)."
            git pull --rebase origin "$GITHUB_REF_NAME"
          done

          echo 'Could not push the overlay after three attempts.'
          exit 1

      # Optional, and off by default: this walks the same services again at
      # full resolution and writes every polygon into Supabase. It is what
      # makes the full-detail offline pack possible, and it takes hours.
      #
      # It needs two repository secrets. Without them there is nothing to fail
      # about — the box was ticked for something this repo cannot do — so it
      # says so and stops, rather than failing a run whose real work is done
      # and already pushed.
      - name: Seed public_lands
        if: ${{ inputs.seed_database }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Skipping the seed: VITE_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY'
            echo 'are not set as repository secrets (Settings > Secrets and'
            echo 'variables > Actions). The overlay above was built and pushed.'
            echo '### Seed skipped — Supabase secrets not set' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          npm run seed -- --lands
