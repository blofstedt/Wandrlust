<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Find free dispersed camping on BLM, National Forest, and Canadian Crown land. Offline maps, live conditions, and fire, flood and storm alerts." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <title>Wandrlust - Public Land & Dispersed Camping Explorer</title>
    <!-- Leaflet's stylesheet is bundled (see MapComponent.tsx), not fetched from
         a CDN. It used to come from unpkg, which put a render-blocking request
         to a third party in front of every cold load of the map — and if that
         request failed, every map pane lost its positioning and the map fell
         apart silently. It is an npm dependency already. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <!-- Keyboard users can jump straight to content instead of tabbing the nav -->
    <a href="#main" class="sr-only-focusable absolute top-2 left-2 z-[9999] px-3 py-2 rounded-xl bg-emerald-600 text-white text-sm font-bold">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
